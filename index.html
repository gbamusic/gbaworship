<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GBA Worship</title>
<meta name="description" content="GBA Worship · Jéssica Dias & Herrison Pontes. Agenda, contratação, músicas e clipes.">
<meta property="og:title" content="GBA Worship">
<meta property="og:description" content="Worship é adoração.">
<meta property="og:image" content="assets/hero.webp">
<meta name="theme-color" content="#26323A">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}

@font-face{font-family:'Anton';src:url(assets/anton.woff2) format('woff2');font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Anton';src:url(assets/anton-ext.woff2) format('woff2');font-display:swap;unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Manrope';font-weight:600;src:url(assets/manrope-600.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Manrope';font-weight:700;src:url(assets/manrope-700.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Manrope';font-weight:800;src:url(assets/manrope-800.woff2) format('woff2');font-display:swap}
:root{
  --noite:#26323A; --funda:#3E505B; --nevoa:#5E7480; --clara:#A9B8BF; --suave:#C9D3D8;
  --creme:#F3ECE2; --ambar:#E98A3A; --bg:#1B242A;
  --r:20px; --gap:12px;
  --display:'Anton',Impact,sans-serif; --ui:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--creme);font-family:var(--ui);font-size:16px;line-height:1.5;letter-spacing:-.2px;
  min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:1040px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);grid-auto-flow:dense}
.card{position:relative;overflow:hidden;border-radius:var(--r);background:var(--noite);color:var(--creme);text-decoration:none;
  display:flex;flex-direction:column;justify-content:flex-end;padding:18px;min-height:150px;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
a.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.35)}
a.card:active{transform:translateY(0) scale(.99)}
a.card:focus-visible{outline:3px solid var(--ambar);outline-offset:3px}
.span2{grid-column:span 2}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(38,50,58,0) 35%,rgba(38,50,58,.92) 100%)}
.card > *:not(.photo):not(.arrow):not(.logo):not(.ripple):not(.tint){position:relative;z-index:1}
.label{font-family:var(--ui);font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--clara)}
.title{font-family:var(--display);text-transform:uppercase;font-weight:400;line-height:.9;letter-spacing:-.5px;margin:0}
.t-xl{font-size:clamp(48px,13vw,92px)} .t-l{font-size:clamp(30px,8vw,48px)} .t-m{font-size:clamp(24px,6vw,32px)}
.arrow{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:rgba(243,236,226,.12);z-index:2}
.arrow svg{width:18px;height:18px}
/* hero */
.hero{min-height:440px;padding:22px}
.hero .logo{position:absolute;top:20px;left:20px;width:64px;height:auto;z-index:2;filter:brightness(0) invert(1);opacity:.9}
.hero p{margin:10px 0 0;font-size:15px;font-weight:600;color:var(--suave)}
.amb{color:var(--ambar)}
/* contrate */
.contrate{background:var(--ambar);color:var(--noite);min-height:190px}
.contrate .label{color:var(--noite);opacity:.75}
.contrate .arrow{background:rgba(38,50,58,.15)}
/* agenda */
.agenda{justify-content:flex-start;gap:10px;background:var(--funda);min-height:190px}
.agenda ul{list-style:none;margin:4px 0 0;padding:0}
.agenda .more{margin-top:auto;padding-top:10px;font-size:13px;font-weight:800;color:var(--creme)}
.agenda li{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid rgba(243,236,226,.18)}
.agenda .d{font-family:var(--display);font-size:22px;color:var(--creme);min-width:52px}
.agenda .c{font-size:14px;font-weight:700;line-height:1.2}
.agenda .c small{display:block;font-size:11px;font-weight:700;color:var(--clara);letter-spacing:1px}
/* play */
.play{width:64px;height:64px;border-radius:32px;background:var(--creme);display:grid;place-items:center;margin-bottom:14px}
.play svg{width:24px;height:24px;margin-left:3px}
.clipe{min-height:260px}
.photo.duo{filter:grayscale(1) contrast(1.15)}
.tint{position:absolute;inset:0;background:var(--nevoa);mix-blend-mode:multiply;pointer-events:none}
/* small */
.mini{min-height:130px;background:var(--nevoa);justify-content:space-between}
.mini svg.ic{width:30px;height:30px}
.mini.dark{background:var(--noite)}
/* trilogia */
.trilogia{background:var(--noite);gap:14px}
.covers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.covers img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.covers span{display:block;margin-top:6px;font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--clara)}
/* recentes */
.recentes{background:var(--noite);justify-content:flex-start;gap:12px;min-height:0;padding:18px}
.recentes ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.recentes a{display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 14px;border-radius:14px;background:var(--funda);color:var(--creme);text-decoration:none;transition:transform .2s,background .2s}
.recentes a:hover{background:var(--nevoa);transform:translateX(3px)}
.recentes a:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
.recentes .tg{flex-shrink:0;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;padding:5px 9px;border-radius:8px;background:rgba(243,236,226,.12);color:var(--suave)}
.recentes .tt{flex:1;font-size:15px;font-weight:700;line-height:1.3}
.recentes .ar{font-weight:800;color:var(--clara)}
.recentes li:first-child a{background:var(--creme);color:var(--noite);min-height:72px}
.recentes li:first-child .tg{background:var(--noite);color:var(--creme)}
.recentes li:first-child .tt{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:24px;line-height:1;letter-spacing:-.3px}
.recentes li:first-child .ar{color:var(--noite)}
/* mapa */
.mapa{background:var(--noite);min-height:300px}
.mapa .photo{object-fit:contain;object-position:right center;opacity:.9}
.mapa .big{font-family:var(--display);font-size:clamp(64px,18vw,110px);line-height:.85;color:var(--creme)}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 4px 0;font-size:12px;font-weight:700;color:var(--clara);letter-spacing:.6px}
@media (min-width:880px){
  body{padding:40px 24px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .hero{grid-column:span 2;grid-row:span 3;min-height:560px}
  .recentes{grid-column:span 2}
  .agenda{grid-row:span 2}
  .clipe{grid-column:span 2}
  .yt{grid-column:span 2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
.contrate.solo{grid-column:span 2}
/* edição */
.edit-fab{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:50;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:24px;background:var(--creme);color:var(--noite);font:800 15px var(--ui);box-shadow:0 10px 30px rgba(0,0,0,.4);cursor:pointer}
.edit-fab:focus-visible,.ed button:focus-visible,.ed input:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
.ed{position:fixed;inset:0;z-index:60;background:rgba(15,20,24,.72);display:flex;justify-content:flex-end}
.ed-panel{width:min(520px,100%);height:100%;overflow:auto;background:var(--noite);padding:24px 20px 120px;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
.ed h2{font:400 34px/1 var(--display);text-transform:uppercase;margin:0 0 6px}
.ed .hint{font-size:13px;color:var(--clara);margin:0 0 18px}
.ed fieldset{border:0;margin:0 0 22px;padding:0}
.ed .acc{margin:0 0 22px;padding:12px 14px;border-radius:12px;background:var(--funda)}
.ed .acc summary{cursor:pointer;min-height:24px;font-size:13px;font-weight:800;color:var(--suave)}
.ed legend{font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--clara);margin-bottom:10px}
.ed label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;color:var(--suave)}
.ed input{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--nevoa);background:var(--bg);color:var(--creme);font:600 15px var(--ui)}
.ed input::placeholder{color:#7d8d96}
.ed .row{display:grid;gap:8px;align-items:end;padding:12px;border-radius:12px;background:var(--funda);margin-bottom:8px}
.ed .row.rec{grid-template-columns:1fr auto}
.ed .row.show{grid-template-columns:90px 1fr 70px auto}
.ed .row .stack{display:grid;gap:6px}
.ed .row label{margin:0 0 2px}
.ed .ico{min-width:44px;min-height:44px;border:0;border-radius:10px;background:rgba(243,236,226,.1);color:var(--creme);font:800 16px var(--ui);cursor:pointer}
.ed .add{min-height:44px;width:100%;border:1.5px dashed var(--clara);border-radius:10px;background:transparent;color:var(--creme);font:800 14px var(--ui);cursor:pointer}
.ed .bar{position:fixed;right:0;bottom:0;width:min(520px,100%);display:flex;gap:10px;padding:14px 20px max(14px,env(safe-area-inset-bottom));background:var(--noite);border-top:1px solid var(--funda)}
.ed .bar button{flex:1;min-height:48px;border-radius:12px;border:0;font:800 15px var(--ui);cursor:pointer}
.ed .save{background:var(--ambar);color:var(--noite)}
.ed .cancel{background:var(--funda);color:var(--creme)}
.ed .msg{font-size:13px;font-weight:700;color:var(--ambar);min-height:18px;margin:0 0 8px}
@media (max-width:420px){.ed .row.show{grid-template-columns:80px 1fr 60px}.ed .row.show .ico{grid-column:1/-1}}


/* ===== fundo vivo ===== */
body{background:var(--bg);position:relative;overflow-x:hidden}
.bg{position:fixed;inset:-20vmax;z-index:-2;pointer-events:none;filter:blur(60px);opacity:.9}
.bg i{position:absolute;border-radius:50%;mix-blend-mode:screen;will-change:transform}
.bg i:nth-child(1){width:60vmax;height:60vmax;left:5%;top:0;background:radial-gradient(circle,rgba(94,116,128,.55),transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){width:50vmax;height:50vmax;right:0;top:30%;background:radial-gradient(circle,rgba(97,122,159,.45),transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
.bg i:nth-child(3){width:34vmax;height:34vmax;left:30%;bottom:5%;background:radial-gradient(circle,rgba(233,138,58,.16),transparent 65%);animation:drift3 22s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,22vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-22vmax,-14vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(14vmax,-20vmax) scale(1.25)}}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;mix-blend-mode:screen}
/* ===== entrada ===== */
.card{opacity:0;transform:translateY(24px) scale(.98)}
.card.in{opacity:1;transform:none;transition:opacity .7s cubic-bezier(.2,.8,.2,1) var(--d,0s),transform .7s cubic-bezier(.2,.8,.2,1) var(--d,0s),box-shadow .3s}
/* ===== hover: luz que segue o mouse + leve inclinação ===== */
a.card{transform-style:preserve-3d}
a.card.in{transition:opacity .7s cubic-bezier(.2,.8,.2,1) var(--d,0s),transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
a.card::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(243,236,226,.16),transparent 45%)}
a.card:hover::before{opacity:1}
a.card.in:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px);box-shadow:0 22px 50px rgba(0,0,0,.45)}
a.card .photo{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
a.card:hover .photo{transform:scale(1.06)}
a.card .arrow{transition:transform .35s cubic-bezier(.2,.8,.2,1),background .3s}
a.card:hover .arrow{transform:translate(3px,-3px) rotate(8deg);background:rgba(38,50,58,.25)}
a.card .play{transition:transform .4s cubic-bezier(.2,1.6,.4,1)}
a.card:hover .play{transform:scale(1.12)}
a.card .play::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(243,236,226,.6);animation:pulse 2.4s ease-out infinite}
.play{position:relative}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
a.card .ic{transition:transform .4s cubic-bezier(.2,1.6,.4,1)}
a.card:hover .ic{transform:scale(1.15) rotate(-6deg)}
.recentes a .ar{transition:transform .3s}
.recentes a:hover .ar{transform:translateX(4px)}
/* contrate: brilho que passa */
.contrate{isolation:isolate}
.contrate::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;z-index:1;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-18deg);animation:shine 5s ease-in-out infinite 2s}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
/* ===== clique: onda ===== */
.ripple{position:absolute;z-index:3;border-radius:50%;pointer-events:none;background:rgba(243,236,226,.35);transform:scale(0);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
a.card:active{transform:scale(.97)!important;transition-duration:.1s!important}
/* hero: título com leve respiração do âmbar */
.hero .amb{background:linear-gradient(90deg,#E98A3A,#F5B26E,#E98A3A);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:amb 6s ease-in-out infinite}
@keyframes amb{50%{background-position:100% 0}}
/* ===== play do pad ===== */
.pad{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px auto 16px;padding:6px 14px 6px 6px;min-height:52px;border:0;border-radius:30px;background:transparent;color:var(--creme);cursor:pointer;font:300 12px var(--ui);letter-spacing:.2px}
.pad .pb{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(243,236,226,.4);transition:transform .4s cubic-bezier(.2,1.6,.4,1),background .3s}
.pad .pb::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(243,236,226,.28);animation:pulse 2.6s ease-out infinite}
.pad:hover .pb{transform:scale(1.08);background:rgba(243,236,226,.07)}
.pad svg.pl{width:13px;height:13px;margin-left:2px}
.pad .lb{color:var(--suave);opacity:.85}
.pad .wave{display:none;width:180px;height:40px}
.pad .wave svg{width:100%;height:100%;overflow:visible}
.pad .wave path{fill:none;stroke-linecap:round;animation:flow linear infinite}
.pad .wave path:nth-child(1){stroke:#E98A3A;stroke-width:1.2;opacity:.9;animation-duration:7s}
.pad .wave path:nth-child(2){stroke:#C9D3D8;stroke-width:.8;opacity:.55;animation-duration:11s;animation-direction:reverse}
.pad .wave path:nth-child(3){stroke:#A9B8BF;stroke-width:.6;opacity:.35;animation-duration:15s}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-180px)}}
.pad.on{padding:6px 10px;gap:0}
.pad.on .pb,.pad.on .lb{display:none}
.pad.on .wave{display:block;-webkit-mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.pad:focus-visible{outline:2px solid var(--ambar);outline-offset:3px}
/* luz viajando no fundo */
.bg-light{position:fixed;z-index:-1;pointer-events:none;width:46vmax;height:46vmax;left:-23vmax;top:-23vmax;border-radius:50%;
  background:radial-gradient(circle,rgba(243,236,226,.13) 0%,rgba(233,138,58,.07) 30%,transparent 62%);filter:blur(10px);mix-blend-mode:screen;animation:travel 48s ease-in-out infinite}
.bg-light.b{width:30vmax;height:30vmax;left:-15vmax;top:-15vmax;background:radial-gradient(circle,rgba(169,184,191,.16),transparent 60%);animation-duration:66s;animation-delay:-20s;animation-direction:reverse}
@keyframes travel{0%{transform:translate(8vw,12vh)}20%{transform:translate(88vw,28vh)}40%{transform:translate(60vw,92vh)}60%{transform:translate(12vw,70vh)}80%{transform:translate(48vw,6vh)}100%{transform:translate(8vw,12vh)}}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}

@media (prefers-reduced-motion:reduce){
  .bg i,.contrate::after,.hero .amb,a.card .play::after,.pad .wave path,.pad .pb::after,.bg-light{animation:none!important}
  .card{opacity:1;transform:none}
  a.card.in:hover{transform:none}
}
</style>
</head>

(function(){
"use strict";

const $ = (s, r) => (r || document).querySelector(s);

  const e = document.createElement(tag);

  yt: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#F3ECE2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z" fill="#F3ECE2"/></svg>',
  doc: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#F3ECE2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg>'

const link = (cls, href, kids, label) => {

const svg = (s, hidden) => { const w = el("span", { html: s }); const n = w.firstChild; n.setAttribute("aria-hidden", "true"); return n; };

const ttl = (t, cls) => el("span", { class: "title " + (cls || "t-m"), text: t, style: "display:block" });

function ytId(u) {
  const m = String(u || "").match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/);
